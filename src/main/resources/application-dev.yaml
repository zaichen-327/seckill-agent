# 服务端口的配置
server:
  port: 8080
  tomcat:
    threads:
      max: 200 # Tomcat服务器最大线程请求数
      min-spare: 10

# Spring Boot 配置
spring:
  application:
    name: seckill-system

  # 数据库连接配置项
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true
    username: root
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20 # 设置远超MQ队列的连接数，保证随时能用
      minimum-idle: 10

  # 保证每一次测试时的数据都是干净的
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: true

  # mybatis的基础配置
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    mapper-locations: classpath:/mapper/*.xml
    # sql语句的拼接在控制带输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    global-config:
      db-config:
        id-type: auto

  # Redis的基础配置
  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    # 增加连接数，防止1000次左右的秒杀压垮数据库
    lettuce:
      pool:
        max-active: 100
        max-idle: 20
        min-idle: 5

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  # 消息队列的配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: seckill
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    # 允许路由失败的消息回退
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
    # 不使用自动重连，因为有些错误消息无法通过框架自己变成JSON，从而无法进入死信队列

# 输出日志的信息到控制台
logging:
  level:
    com:
      question:
        seckillagent:
          mapper: debug
          service: info
          controller: info

jwt:
  secret: ${JWT_SECRET:seckill-agent-secret-key}
  expire: 86400000